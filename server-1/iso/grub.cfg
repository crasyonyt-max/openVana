set timeout=5
set default=0

insmod all_video
insmod gfxterm
if loadfont unicode; then
    set gfxmode=auto
    terminal_output gfxterm
fi
set gfxpayload=keep
set menu_color_normal=white/black
set menu_color_highlight=black/light-green

menuentry "openVana Server 1.0  (VanaKernel Hydra)" {
    linux /live/vmlinuz boot=live quiet splash
    initrd /live/initrd.img
}
menuentry "openVana Server 1.0  (load into RAM, USB stick can be removed)" {
    linux /live/vmlinuz boot=live toram quiet splash
    initrd /live/initrd.img
}
menuentry "openVana Server 1.0  (safe mode: basic graphics, no boot screen)" {
    linux /live/vmlinuz boot=live nomodeset plymouth.enable=0
    initrd /live/initrd.img
}
menuentry "openVana Server 1.0  (Debian fallback kernel)" {
    linux /live/vmlinuz-debian boot=live quiet splash
    initrd /live/initrd-debian.img
}
