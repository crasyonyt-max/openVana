set timeout=3
set default=0

# Boot the kernel in a graphics mode, so legacy-BIOS PCs also get a
# framebuffer that the generic simpledrm driver can use.
insmod all_video
insmod gfxterm
if loadfont unicode; then
    set gfxmode=auto
    terminal_output gfxterm
fi
set gfxpayload=keep

menuentry "openVana 1.0" {
    linux /boot/vmlinuz quiet loglevel=3
    initrd /boot/initramfs.img
}
menuentry "openVana 1.0 (safe graphics)" {
    linux /boot/vmlinuz nomodeset loglevel=4
    initrd /boot/initramfs.img
}
