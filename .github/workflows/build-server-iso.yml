name: Build openVana Server ISO

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["server-1/**", ".github/workflows/build-server-iso.yml"]

permissions:
  contents: write

concurrency:
  group: build-server-iso
  cancel-in-progress: true

jobs:
  iso:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    defaults:
      run:
        shell: bash
        working-directory: "server-1"
    env:
      RUN: docker run --rm --privileged -v ${{ github.workspace }}/server-1:/src openvana-server-build
    steps:
      - name: Free disk space
        working-directory: /
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost
          docker image prune -af >/dev/null
          df -h /

      - uses: actions/checkout@v4

      - name: Build environment
        run: docker build -t openvana-server-build -f Containerfile . 2>&1 | tee -a build.log

      - name: Restore VanaKernel Hydra
        id: kcache
        uses: actions/cache@v4
        with:
          path: server-1/out/kernel
          key: vanakernel-hydra-${{ hashFiles('server-1/kernel/**') }}

      - name: Build VanaKernel Hydra
        if: steps.kcache.outputs.cache-hit != 'true'
        run: |
          $RUN ./kernel/build-kernel.sh 2>&1 | tee -a build.log | grep -vE '^\s+(CC|LD|AR|AS|GEN|HOSTCC|CHK|UPD|OBJCOPY|MKCAP|SIGN|ZSTD|STRIP|INSTALL|BTF|SYNC|POLICY|CERT|EXTRACT|DESCEND|VDSO|SYSHDR|SYSTBL|WRAP|COPY|HDRINST|HYPERCALLS|LDS|RELOCS|SORTTAB|MODPOST|CC \[M\]|LD \[M\]) '
          sudo rm -rf out/linux-*/   # source tree no longer needed, frees disk space

      - name: Build root filesystem
        run: $RUN ./rootfs/build-rootfs.sh 2>&1 | tee -a build.log

      - name: Build ISO
        run: $RUN ./iso/build-iso.sh 2>&1 | tee -a build.log

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo chown -R "$(id -u):$(id -g)" out
          ISO=out/openvana-server-1.0-amd64.iso
          ls -lh "$ISO" out/kernel | tee -a build.log
          (cd out && sha256sum openvana-server-1.0-amd64.iso > openvana-server-1.0-amd64.iso.sha256)
          gh release delete server-1 --yes --cleanup-tag 2>&1 | tee -a build.log || true
          gh release create server-1 "$ISO" "$ISO.sha256" out/kernel/*.deb \
            --latest=false \
            --title "openVana Server 1.0" \
            --notes "openVana Server 1.0: Debian 13 based server OS with VanaKernel Hydra $(cat out/kernel/release). Bootable ISO (BIOS + UEFI, live system + installer). The .deb files are the VanaKernel Hydra kernel and headers. Built from ${GITHUB_SHA::7}." 2>&1 | tee -a build.log

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo chown "$(id -u)" build.log 2>/dev/null || true
          { echo '### Server ISO build failed — last log lines'; echo '```'; tail -c 60000 build.log; echo '```'; } > comment.md
          gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" -F body=@comment.md
