name: Build openVana ISO

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["base-1/**", "!base-1/docs/**", "!base-1/README.md", ".github/workflows/build-iso.yml"]

permissions:
  contents: write

concurrency:
  group: build-iso
  cancel-in-progress: true

jobs:
  iso:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
        working-directory: "base-1"
    env:
      RUN: docker run --rm -v ${{ github.workspace }}/base-1:/src openvana-build
    steps:
      - name: Free disk space
        working-directory: /
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: actions/checkout@v4

      - name: Build environment
        run: docker build -t openvana-build -f Containerfile . 2>&1 | tee -a build.log

      - name: Restore VanaKernel
        id: kcache
        uses: actions/cache@v4
        with:
          path: base-1/out/kernel
          key: vanakernel-${{ hashFiles('base-1/kernel/**') }}

      - name: Build VanaKernel
        if: steps.kcache.outputs.cache-hit != 'true'
        run: $RUN ./kernel/build-kernel.sh 2>&1 | tee -a build.log

      - name: Build root filesystem
        run: $RUN ./rootfs/build-rootfs.sh 2>&1 | tee -a build.log

      - name: Build ISO
        run: $RUN ./iso/build-iso.sh 2>&1 | tee -a build.log

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo chown -R "$(id -u):$(id -g)" out
          ISO=out/openvana-base-1-x86_64.iso
          ls -lh "$ISO" | tee -a build.log
          (cd out && sha256sum openvana-base-1-x86_64.iso > openvana-base-1-x86_64.iso.sha256)
          gh release delete base-1 --yes --cleanup-tag 2>&1 | tee -a build.log || true
          gh release create base-1 "$ISO" "$ISO.sha256" \
            --title "openVana Base 1" \
            --notes "Bootable openVana Base 1 ISO (x86_64, BIOS + UEFI). Write it to a USB stick (e.g. with balenaEtcher or Rufus) and boot. Built from ${GITHUB_SHA::7}." 2>&1 | tee -a build.log

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo chown "$(id -u)" build.log 2>/dev/null || true
          { echo '### ISO build failed — last log lines'; echo '```'; tail -c 60000 build.log; echo '```'; } > comment.md
          gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" -F body=@comment.md
